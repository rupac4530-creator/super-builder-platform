global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@superbuilder.dev"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "critical"
      match:
        severity: critical
      repeat_interval: 1h
    - receiver: "slack"
      match:
        severity: warning

receivers:
  - name: "default"
    email_configs:
      - to: "ops@superbuilder.dev"
        send_resolved: true

  - name: "critical"
    email_configs:
      - to: "ops@superbuilder.dev"
        send_resolved: true
    webhook_configs:
      - url: "http://backend:3001/api/alerts/webhook"
        send_resolved: true

  - name: "slack"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
