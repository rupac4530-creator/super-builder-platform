# Engine Alto — Kubernetes Manifests
# Backend API Deployment + Service

apiVersion: v1
kind: Namespace
metadata:
  name: engine-alto
  labels:
    app: engine-alto

---
# Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alto-backend
  namespace: engine-alto
  labels:
    app: alto-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alto-backend
  template:
    metadata:
      labels:
        app: alto-backend
    spec:
      containers:
        - name: backend
          image: engine-alto-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alto-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: alto-secrets
                  key: redis-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: alto-backend
  namespace: engine-alto
spec:
  selector:
    app: alto-backend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alto-frontend
  namespace: engine-alto
  labels:
    app: alto-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alto-frontend
  template:
    metadata:
      labels:
        app: alto-frontend
    spec:
      containers:
        - name: frontend
          image: engine-alto-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://alto-backend:3001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: alto-frontend
  namespace: engine-alto
spec:
  selector:
    app: alto-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer

---
# GPU Training Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alto-gpu-worker
  namespace: engine-alto
  labels:
    app: alto-gpu-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alto-gpu-worker
  template:
    metadata:
      labels:
        app: alto-gpu-worker
    spec:
      containers:
        - name: gpu-worker
          image: engine-alto-ai-worker:latest
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: alto-secrets
                  key: redis-url
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alto-backend-hpa
  namespace: engine-alto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alto-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Secrets (placeholder — use kubectl create secret or external-secrets)
apiVersion: v1
kind: Secret
metadata:
  name: alto-secrets
  namespace: engine-alto
type: Opaque
stringData:
  database-url: "postgresql://alto:changeme@postgres:5432/alto_db"
  redis-url: "redis://redis:6379"
  # IMPORTANT: Use kubectl create secret or Vault/External-Secrets operator
  # See SECURITY.md for setup instructions. NEVER commit real keys.
  openai-api-key: "REPLACE_ME_VIA_KUBECTL_OR_VAULT"
