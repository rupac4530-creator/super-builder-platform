version: "3.8"

services:
  superbuilder:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: PostgreSQL for persistent storage
  # Uncomment to enable
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: superbuilder
  #     POSTGRES_USER: superbuilder
  #     POSTGRES_PASSWORD: superbuilder_secret
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # Optional: Redis for caching
