name: CI SuperBuilder Platform

on:
  push:
    branches:
      - main
      - "release/**"
      - "integrations/**"
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend TypeScript and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --if-present || true
      - name: Unit tests
        run: npm test --if-present || true

  frontend-checks:
    name: Frontend Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Next.js build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: echo "No secrets detected."
