# Prometheus scrape config for Engine Alto GPU AI Lab
# Phase I: Monitoring & Metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'engine-alto-backend'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'gpu-metrics'
    static_configs:
      - targets: ['localhost:9835']
    # dcgm-exporter or nvidia_gpu_exporter

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']

# Alert rules
rule_files:
  - 'alert-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
